name: ci

# Every action is pinned by a full commit sha (version in a comment), the token is read-only, there is no
# pull_request_target, and no untrusted input reaches a run: line. Contributions are data: the validator reads them, it
# never executes them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust toolchain (stable, with clippy)
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
        shell: bash
      - name: build
        run: cargo build --release --locked
      - name: gate self-test (each gate red on its red fixture, green on the green one)
        run: cargo run -q --release --locked -- selftest
      - name: validate the whole tree
        run: cargo run -q --release --locked -- validate
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
